# ============================================================================
# Domain Pack: technology
# AI-SQ Universal Root-Inquiry / 通用求根问底调研 Skill
# ----------------------------------------------------------------------------
# 领域包不是装饰，而是通用内核的适配接口。
# 内核管：问题树 / 证据链 / 缺口递归 / 范围与反例 / 层级校验 / 停止控制 / 报告。
# 领域包管：实体层级 / 关系类型 / 结构语义 / 权威源 / 证据分级 / 高风险边界。
#
# 领域包不得绕过通用规则：反例检查、层级校验、停止规则、质量门禁永远优先。
# 领域包只能"细化"证据等级，不能把通用 A/B/C/D 地板整体降级。
# ============================================================================

domain: technology
display_name: 技术 / Technology
version: 1.0.0
extends: null
high_risk: false
high_risk_note: >
  通用技术问题默认低风险；但涉及网络安全攻防（exploit / 漏洞利用）、密码学与密钥管理、
  航空与交通控制、医疗器械与植入设备、电网与工控（ICS/SCADA）、自动驾驶与人身安全时，
  升级为高风险：必须加免责声明、标注适用版本与前提、建议人工/专家复核；
  不输出可直接用于未授权入侵、绕过安全控制、制造人身伤害或规避监管的可操作细节。

# ---------------------------------------------------------------------------
# 1. 实体层级（粗 -> 细）。用于层级校验：防止把协议行为套到单个实现、把文档当实现。
# ---------------------------------------------------------------------------
entity_levels:
  - system              # 系统 / 产品 / 平台
  - subsystem           # 子系统 / 服务
  - module              # 模块 / 组件 / 库
  - interface           # 接口 / API / 消息契约
  - protocol            # 协议 / 报文格式 / 状态机
  - algorithm           # 算法 / 调度策略 / 编解码方案
  - data_structure      # 数据结构 / 存储模式 / 索引结构
  - parameter           # 参数 / 超参数 / 常量 / 阈值
  - config              # 配置项 / 配置档 / 特性开关（feature flag）
  - version             # 版本 / 分支 / 发布线（semver）
  - build_artifact      # 构建产物 / 包 / 容器镜像 / 固件
  - deployment          # 部署实例 / 集群 / 拓扑
  - runtime_environment # 运行环境（OS / 运行时 / 硬件 / 网络条件）

# ---------------------------------------------------------------------------
# 2. 允许的关系类型。问题节点 relation 字段应落在此清单内，避免自造关系。
# ---------------------------------------------------------------------------
relations:
  - is_a
  - part_of
  - has_property
  - causes
  - contributes_to
  - requires
  - precedes
  - located_in
  - conflicts_with
  - evidence_for
  - counterexample_to
  - correlates_with
  - measured_by

# ---------------------------------------------------------------------------
# 3. 结构语义："几段/多少/几个" 在本领域指什么。回答前必须先消歧。
# ---------------------------------------------------------------------------
structure_semantics:
  segment: 模块 / 层 / 接口 / 流水线阶段
  copy: 实例 / 副本 / 分片副本
  variant: 版本 / 分支 / 配置档 / 实现变体
  unit: 字节 / 请求 / 毫秒（延迟）/ QPS / 百分比（可用性）/ 语义化版本号
  level: 单机 < 集群 < 区域 < 全球；协议栈：链路层 < 网络层 < 传输层 < 应用层
  stage: 开发 -> 测试 -> 灰度 -> 生产 -> 弃用（生命周期阶段）

# ---------------------------------------------------------------------------
# 4. 权威来源优先级（1 最高）。检索应按序尝试，不要一上来就查百科。
# ---------------------------------------------------------------------------
authoritative_sources:
  - name: 标准（IETF RFC / ISO / IEEE / W3C / ITU）
    kind: standard
    id_pattern: "RFC 9110 / ISO/IEC 27001:2022 / IEEE 802.11ax / W3C REC"
    priority: 1
  - name: 源码仓库（tag / commit）
    kind: source_repository
    id_pattern: "repo + tag 或 commit SHA（如 v2.4.1 / 9f3c1ab）"
    priority: 1
  - name: 官方文档与发布说明（docs / changelog / release notes）
    kind: official_docs
    id_pattern: "文档 URL + 适用版本号"
    priority: 2
  - name: 同行评议论文与顶级会议论文
    kind: literature
    id_pattern: "DOI / 会议名 + 年份（如 USENIX ATC 2023）"
    priority: 2
  - name: CVE / NVD 与厂商安全公告
    kind: vulnerability_database
    id_pattern: "CVE-YYYY-NNNNN / GHSA-xxxx / 厂商 advisory 编号"
    priority: 3
  - name: 基准测试报告与独立评测
    kind: benchmark_report
    id_pattern: "报告名 + 日期 + 硬件/软件环境"
    priority: 4
  - name: 百科 / 博客 / 问答 / 厂商营销材料
    kind: encyclopedia
    id_pattern: "URL"
    priority: 5

# ---------------------------------------------------------------------------
# 5. 证据等级细化（只能加约束，不能整体降级）。
# ---------------------------------------------------------------------------
evidence_grades:
  A: >
    标准文本 + 多个独立实现的一致性行为 + 可复现实测三者互证；
    或多个独立团队（不同环境）复现的系统性评测，且结论已回应主要反例。
  B: >
    官方文档与源码一致，并在至少一个明确环境下完成可复现实测；
    或权威基准报告中单环境、方法透明的测量。
  C: >
    单一实现的行为观察、单次基准、未复现的实测、预印本、未标注环境的性能数字、
    未绑定版本号的经验性结论。
  D: 百科、论坛问答、博客、厂商营销材料、AI 生成摘要、无法复现的"N=1 anecdote"。
  rules:
    - 文档与实现不一致时，以源码 + 可复现实测为准，并显式标注冲突点与版本。
    - 任何技术结论必须绑定版本号 / commit；未绑定版本的结论默认 C，不得升 A/B。
    - 基准测试不得跨硬件、数据集、负载形态直接比较；引用时必须给出环境与工作负载。
    - 单一实现的行为不代表协议/标准；标准要求与实现事实必须分开陈述。
    - deprecated / 已弃用路径只能作为兼容性说明，不得当作当前最佳实践。
    - 结论依赖配置时，必须写明配置项、默认值与非默认前提。
    - 厂商营销声明默认 D；需第三方评测或独立实测才可升 B。

# ---------------------------------------------------------------------------
# 6. 反例与边界检查（本领域必须执行的检查项）。
# ---------------------------------------------------------------------------
counterexample_rule: >
  1) 文档与实现不一致：任何"文档说支持"的结论必须核对源码或实测；
  2) 版本漂移：行为随版本/分支变化，须给出适用版本区间，并检查 changelog 中的 breaking change；
  3) 基准测试环境差异：CPU/内存/网络/数据集/并发不同则数字不可比，须给环境卡；
  4) 单一实现不代表协议：某实现的 bug 或扩展不构成标准行为，标准与实现分开写；
  5) 已弃用（deprecated）路径：仍能用 != 应该用，须检查替代方案与移除时间表；
  6) 配置依赖：同一版本在不同配置下行为可能相反，须写明配置项与默认值；
  7) N=1 的 anecdote：个案体验不构成结论，除非给出可复现步骤与环境；
  8) 规模外推：小数据/低并发下的结论不得直接推至生产规模与故障态（failover、网络分区）。

# ---------------------------------------------------------------------------
# 7. 必须消歧的术语（回答"几段/多少/是否都成立"前先定锚）。
# ---------------------------------------------------------------------------
disambiguation:
  - term: 支持 / 不支持
    candidates: [标准规范层面, 某实现层面, 某版本层面, 某配置下, 仅实验性（experimental/alpha）]
    resolve_by: 用"标准 × 实现 × 版本 × 配置"四元组定锚，缺一项即标注"未定"。
  - term: 多少 / 多快
    candidates: [理论峰值, 基准实测（注明环境）, 生产观测（p50/p99）, 单次 anecdote]
    resolve_by: 指定指标定义、分位数、硬件与负载，区分理论值 / 实测值 / 观测值。
  - term: 几个 / 几层
    candidates: [进程或副本数, 模块或层数, 分片数, 重试次数]
    resolve_by: 用 structure_semantics 定锚，并说明是逻辑结构还是物理部署。
  - term: 最新版本 / 现在
    candidates: [最新稳定版（stable）, 最新 LTS, 最新预览版（preview）, 文档快照日期]
    resolve_by: 声明查询时间点与渠道（release page / registry），并标注是否为 LTS。

# ---------------------------------------------------------------------------
# 8. 好答案的形态（报告对应章节应长这样）。
# ---------------------------------------------------------------------------
answer_patterns:
  - type: element_inventory
    shape: "组件表：组件 | 版本/commit | 接口/协议 | 职责 | 依赖 | 已知限制 | 证据等级"
  - type: mechanism
    shape: "请求/数据路径：入口 -> 模块（标注同步/异步）-> 存储/出口；附超时、重试、失败模式与降级"
  - type: scope
    shape: "兼容性矩阵：特性 × 标准 × 实现 × 版本 × 配置 × 环境 × 反例 × 证据等级"

# ---------------------------------------------------------------------------
# 9. 停止提示（本领域常见的"该停了"信号）。
# ---------------------------------------------------------------------------
stop_hints:
  - 已定位到具体版本/commit，并有可复现实测，文档与实现一致。
  - 文档与实现冲突且无法实测 -> 停止并标注"待验证（需最小复现实验）"。
  - 连续检索只返回互相抄的博客与问答 -> 停止，回到官方文档与源码。
  - 问题下沉到私有部署或内部配置细节，公开资料不可达 -> 标注"需环境信息"。
  - 只剩厂商营销材料 -> 标记 D 级线索并停止。

frontier_sources:
  - IETF 工作组草案与 RFC 更新（draft 须标注未定稿）
  - 项目 release notes / changelog / GitHub releases 与 issues
  - USENIX ATC/NSDI/OSDI、SIGCOMM、ACM 会议与 arXiv CS
  - 基准测试套件与独立评测（MLPerf、SPEC、TPC、TechEmpower）
  - CVE/NVD 与厂商 security advisory
