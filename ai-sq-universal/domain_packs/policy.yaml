# ============================================================================
# Domain Pack: policy
# AI-SQ Universal Root-Inquiry / 通用求根问底调研 Skill
# ----------------------------------------------------------------------------
# 内核管：问题树 / 证据链 / 缺口递归 / 范围与反例 / 层级校验 / 停止控制 / 报告。
# 领域包管：实体层级 / 关系 / 结构语义 / 权威源 / 证据分级 / 高风险边界；只细化、不降级、不绕过校验。
# ============================================================================

domain: policy
display_name: 政策 / Policy
version: 1.0.0
extends: null
high_risk: true
high_risk_note: >
  政策问题默认高风险：涉及政府行为、公共资源分配与群体权益，输出须中立、可溯源；
  涉及政治敏感议题或价值判断时，标注不确定性、区分事实与立场，不给政策做价值背书。

# ---------------------------------------------------------------------------
# 1. 实体层级（粗 -> 细）。用于层级校验：政策文本属性不得套到执行个案，产出不得当结果。
# ---------------------------------------------------------------------------
entity_levels:
  - policy_system       # 政策体系
  - policy              # 政策（文件 / 法律 / 规划）
  - objective           # 目标（总目标 / 具体目标）
  - instrument          # 工具（财政 / 监管 / 信息 / 组织）
  - clause              # 条款（实施细则 / 操作口径）
  - implementing_body   # 执行主体（部门 / 地方 / 基层）
  - stakeholder         # 利益相关方
  - pilot               # 试点（地区 / 批次）
  - output              # 产出（output：服务量 / 覆盖数）
  - evidence            # 证据单元（文件 / 统计 / 评估）

# ---------------------------------------------------------------------------
# 2. 允许的关系类型。问题节点 relation 字段应落在此清单内，避免自造关系。
# ---------------------------------------------------------------------------
relations:
  - is_a
  - part_of
  - has_property
  - causes
  - contributes_to
  - requires
  - conflicts_with
  - evidence_for
  - counterexample_to

# ---------------------------------------------------------------------------
# 3. 结构语义："几段/多少/几个" 在本领域指什么。回答前必须先消歧。
# ---------------------------------------------------------------------------
structure_semantics:
  segment: 条款 / 阶段 / 试点批次
  copy: 政策版本 / 修订
  variant: 中央 vs 地方 / 试点 vs 全面
  unit: 覆盖率 / 受益人数 / 财政投入 / 达标率
  level: 政策体系 < 政策 < 目标 < 工具 < 条款 < 执行
  stage: 议程设定 -> 设计 -> 试点 -> 全面实施 -> 评估 -> 调整或退出

# ---------------------------------------------------------------------------
# 4. 权威来源优先级（1 最高）。检索应按序尝试，不要一上来就查百科。
# ---------------------------------------------------------------------------
authoritative_sources:
  - name: 政府文件与公报（国务院 / 部委 / 地方政府公报）
    kind: official_gazette
    id_pattern: "文号（如国发〔2024〕N 号 / 政府令第 N 号）"
    priority: 1
  - name: 人大立法与法律文本
    kind: legislation
    id_pattern: "法律名称 + 通过/修订日期 + 条文号"
    priority: 1
  - name: 官方统计（国家统计局 / 部门统计年鉴）
    kind: official_statistics
    id_pattern: "统计年鉴年份 + 表号 / 指标代码"
    priority: 2
  - name: 政策评估报告（政府评估 / 第三方评估）
    kind: evaluation_report
    id_pattern: "评估报告名称 + 发布机构 + 年份"
    priority: 3
  - name: 第三方研究与国际组织（WHO / OECD / World Bank）
    kind: research_and_igo
    id_pattern: "DOI / 报告编号"
    priority: 4

# ---------------------------------------------------------------------------
# 5. 证据等级细化（只能加约束，不能整体降级）。
# ---------------------------------------------------------------------------
evidence_grades:
  A: >
    官方文件原文 + 实施细则 + 官方统计三方一致；或有反事实设计（DID / RCT / 断点）且经同行评议的评估。
  B: >
    官方文件加官方统计；或单一高质量评估研究（方法透明、有反事实、有稳健性检验）。
  C: >
    单一地区数据、单一第三方报告、无对照的前后比较、案例描述。
  D: 媒体解读、百科、自媒体、宣传材料、AI 生成摘要。
  rules:
    - 政策意图（文件表述）与执行（预算、考核、基层行为）必须分开陈述。
    - 效果结论必须有反事实；无对照只能写"同期变化"，不得写"导致"。
    - output / outcome / impact 三级不得混用；价值判断保持中立并标注。

# ---------------------------------------------------------------------------
# 6. 反例与边界检查（本领域必须执行的检查项）。
# ---------------------------------------------------------------------------
counterexample_rule: >
  1) 意图 vs 执行：文件写了不等于落地，须查预算、考核与基层执行；
  2) 试点选择偏差：试点地区或单位非随机，成功不能直接外推全面推行；
  3) 挤出效应：公共投入可能替代原本私人投入，净效应小于毛效应；
  4) 时间滞后：效果滞后期不同，短期无效应不等于无效；
  5) Goodhart 定律：指标成为考核目标即被操纵，须查原始数据与操作化定义；
  6) 地方差异与未观测混杂：地区禀赋、同期其他政策（policy bundle）须剔除。

# ---------------------------------------------------------------------------
# 7. 必须消歧的术语（回答"几段/多少/是否都成立"前先定锚）。
# ---------------------------------------------------------------------------
disambiguation:
  - term: 政策效果
    candidates: [产出 output, 结果 outcome, 影响 impact, 成本效益]
    resolve_by: 先定层级与反事实，再谈效应大小与显著性。
  - term: 覆盖多少人 / 投入多少钱
    candidates: [名义覆盖, 实际受益, 预算安排, 实际支出]
    resolve_by: 用 structure_semantics 定锚，注明年度与统计口径。

# ---------------------------------------------------------------------------
# 8. 好答案的形态（报告对应章节应长这样）。
# ---------------------------------------------------------------------------
answer_patterns:
  - type: element_inventory
    shape: "政策要素表：文件 | 发文主体 | 层级 | 目标 | 工具 | 条款 | 预算 | 证据等级"
  - type: scope
    shape: "适用矩阵：结论 | 地区 | 时间窗 | 目标群体 | 执行强度 | 反例 | 证据等级"

# ---------------------------------------------------------------------------
# 9. 停止提示（本领域常见的"该停了"信号）。
# ---------------------------------------------------------------------------
stop_hints:
  - 文件原文 + 实施细则 + 官方统计三方一致。
  - 效果仅有相关性、无评估设计 -> 标注"关联非因果"。
  - 仅剩媒体解读且无法回溯官方文件 -> 标注"线索级结论"。

frontier_sources:
  - 国务院政策文件库 / 部委最新公告
  - OECD / World Bank / WHO 评估报告
