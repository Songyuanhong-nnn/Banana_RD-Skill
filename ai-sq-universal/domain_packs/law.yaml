# ============================================================================
# Domain Pack: law
# AI-SQ Universal Root-Inquiry / 通用求根问底调研 Skill
# ----------------------------------------------------------------------------
# 内核管：问题树 / 证据链 / 缺口递归 / 范围与反例 / 层级校验 / 停止控制 / 报告。
# 领域包管：实体层级 / 关系 / 结构语义 / 权威源 / 证据分级 / 高风险边界；只细化、不降级、不绕过校验。
# ============================================================================

domain: law
display_name: 法律 / Law
version: 1.0.0
extends: null
high_risk: true
high_risk_note: >
  法律问题默认高风险：输出不构成法律意见，不得替代执业律师判断；涉及刑事、诉讼时效、
  行政处罚、合同履行、跨境合规时，必须标注法域与时间效力、给出条文出处并建议专业复核。

# ---------------------------------------------------------------------------
# 1. 实体层级（粗 -> 细）。用于层级校验：法条属性不得套到个案，学理不得当规范。
# ---------------------------------------------------------------------------
entity_levels:
  - legal_system            # 法律体系 / 法系
  - statute                 # 法律（法典 / 单行法）
  - regulation              # 行政法规 / 地方性法规 / 部门规章
  - article                 # 条文（第 N 条）
  - paragraph               # 款（第 N 款）
  - item                    # 项（第 N 项）
  - judicial_interpretation # 司法解释 / 指导性文件
  - precedent               # 案例（指导案例 / 公报案例 / 裁判文书）
  - element                 # 要件（构成要件 / 成立要件）
  - remedy                  # 救济（诉 / 上诉 / 再审 / 赔偿）

# ---------------------------------------------------------------------------
# 2. 允许的关系类型。问题节点 relation 字段应落在此清单内，避免自造关系。
# ---------------------------------------------------------------------------
relations:
  - is_a
  - part_of
  - has_property
  - regulates
  - requires
  - conflicts_with
  - evidence_for
  - counterexample_to

# ---------------------------------------------------------------------------
# 3. 结构语义："几段/多少/几个" 在本领域指什么。回答前必须先消歧。
# ---------------------------------------------------------------------------
structure_semantics:
  segment: 条 / 款 / 项 / 目
  copy: 版本 / 修订 / 修正案（同一法律的不同文本）
  variant: 修订版 / 司法解释 / 地方性法规 / 特别法
  unit: 条文序号 / 条款数 / 案号 / 刑期 / 赔偿金额
  level: 法律体系 > 法律 > 章 / 节 > 条 > 款 > 项 > 目
  stage: 立法 -> 生效 -> 修订 -> 废止；一审 -> 二审 -> 再审

# ---------------------------------------------------------------------------
# 4. 权威来源优先级（1 最高）。检索应按序尝试，不要一上来就查百科。
# ---------------------------------------------------------------------------
authoritative_sources:
  - name: 国家法律法规数据库（flk.npc.gov.cn）
    kind: official_legal_database
    id_pattern: "法律名称 + 公布/修正日期 + 条文号（如《民法典》第 1165 条）"
    priority: 1
  - name: 最高人民法院指导案例与司法解释
    kind: official_judicial_document
    id_pattern: "指导案例第 N 号 / 法释〔年份〕N 号"
    priority: 1
  - name: 中国裁判文书网（裁判文书）
    kind: case_database
    id_pattern: "案号（如 (2021)最高法民终 N 号）"
    priority: 2
  - name: 权威释义（立法释义 / 最高人民法院理解与适用）
    kind: authoritative_commentary
    id_pattern: "书名 + 版次 + 对应条文"
    priority: 3
  - name: 法学核心期刊论文与学理文章
    kind: academic_literature
    id_pattern: "DOI / CNKI 篇名"
    priority: 4

# ---------------------------------------------------------------------------
# 5. 证据等级细化（只能加约束，不能整体降级）。
# ---------------------------------------------------------------------------
evidence_grades:
  A: >
    多源官方法源相互印证：现行有效条文 + 官方法律数据库版本 + 指导案例/司法解释 + 权威释义一致。
  B: >
    单一官方法源（条文、司法解释、裁判文书）加权威释义支持；同行评议法学论文。
  C: >
    单一裁判文书、单篇学理文章、未经核对的数据库转述、非权威解读。
  D: 百科、新闻、自媒体、AI 生成摘要、营销文案。
  rules:
    - 条文必须标注版本与生效日期；已废止或已修订条文不得当作现行法引用。
    - 判例须区分指导性案例（应当参照）、公报案例与普通裁判文书，效力不同。
    - 学理观点不得写成法律规则；解释论（lex lata）与立法论（lex ferenda）分开。
    - 个案裁判除指导性案例外不产生普遍拘束力；本领域输出不构成法律意见。

# ---------------------------------------------------------------------------
# 6. 反例与边界检查（本领域必须执行的检查项）。
# ---------------------------------------------------------------------------
counterexample_rule: >
  1) 特别法优于一般法：一般法结论遇到特别法即让位，须先检索特别规定；
  2) 新法优于旧法：同一事项新旧法冲突以新法为准，但须检查"从旧兼从轻"等例外；
  3) 例外条款与但书：正文结论必须复核"但是 / 除外 / 另有规定的除外"；
  4) 地域与时间效力：法域（大陆 / 港澳台 / 涉外）、生效与失效时点决定适用与否；
  5) 旧法适用：法不溯及既往、从旧兼从轻；位阶冲突时下位法抵触上位法无效。

# ---------------------------------------------------------------------------
# 7. 必须消歧的术语（回答"几段/多少/是否都成立"前先定锚）。
# ---------------------------------------------------------------------------
disambiguation:
  - term: 第几条
    candidates: [现行有效条文号, 修订前条文号, 司法解释对应条号]
    resolve_by: 先定法律名称与版本（公布/修正日期），再定位条 -> 款 -> 项。
  - term: 违法 / 犯罪
    candidates: [民事违约, 行政违法, 刑事犯罪, 仅违反内部规章]
    resolve_by: 区分法律部门与责任类型，不得把"违法"直接等同于"犯罪"。

# ---------------------------------------------------------------------------
# 8. 好答案的形态（报告对应章节应长这样）。
# ---------------------------------------------------------------------------
answer_patterns:
  - type: element_inventory
    shape: "法源表：规范名称 | 条文号 | 效力位阶 | 生效/修订日期 | 适用主体 | 证据等级"
  - type: scope
    shape: "适用矩阵：结论 | 法域 | 时间（行为时/裁判时）| 主体 | 例外 | 反例 | 证据等级"

# ---------------------------------------------------------------------------
# 9. 停止提示（本领域常见的"该停了"信号）。
# ---------------------------------------------------------------------------
stop_hints:
  - 已定位现行有效条文 + 对应司法解释或指导案例，且二者一致。
  - 争议属学理分歧且无权威解释 -> 标注"存在解释争议"并列出两说。
  - 需个案事实认定（证据、过错、因果）-> 标记"需结合案卷与律师判断"。

frontier_sources:
  - 最高人民法院公报 / 指导案例新批次
  - 法学核心期刊（中外法学 / 法学研究 / 中国法学）
