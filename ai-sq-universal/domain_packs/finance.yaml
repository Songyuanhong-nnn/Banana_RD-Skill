# ============================================================================
# Domain Pack: finance
# AI-SQ Universal Root-Inquiry / 通用求根问底调研 Skill
# ----------------------------------------------------------------------------
# 内核管：问题树 / 证据链 / 缺口递归 / 范围与反例 / 层级校验 / 停止控制 / 报告。
# 领域包管：实体层级 / 关系 / 结构语义 / 权威源 / 证据分级 / 高风险边界；只细化、不降级、不绕过校验。
# ============================================================================

domain: finance
display_name: 金融 / Finance
version: 1.0.0
extends: null
high_risk: true
high_risk_note: >
  金融问题默认高风险：输出不构成投资建议，不得作为交易依据；涉及杠杆、衍生品、
  流动性与监管合规时，必须标注口径与假设、数据时点，并提示本金损失风险。

# ---------------------------------------------------------------------------
# 1. 实体层级（粗 -> 细）。用于层级校验：产品属性不得套到合约条款，指数不得当可交易标的。
# ---------------------------------------------------------------------------
entity_levels:
  - market            # 市场（股票 / 债券 / 商品 / 外汇 / 衍生品）
  - asset_class       # 资产类别
  - institution       # 机构（发行人 / 管理人 / 交易对手）
  - product           # 产品（基金 / 债券 / 结构化产品）
  - contract          # 合约（条款与现金流的载体）
  - clause            # 条款（分层 / 赎回 / 触发 / 增信）
  - risk_factor       # 风险因子（利率 / 信用 / 汇率 / 波动率）
  - cash_flow         # 现金流（票息 / 分红 / 兑付）
  - position          # 头寸（持仓 / 敞口）
  - valuation         # 估值（价格 / 净值 / 模型值）

# ---------------------------------------------------------------------------
# 2. 允许的关系类型。问题节点 relation 字段应落在此清单内，避免自造关系。
# ---------------------------------------------------------------------------
relations:
  - is_a
  - part_of
  - has_property
  - causes
  - measured_by
  - correlates_with
  - evidence_for
  - counterexample_to

# ---------------------------------------------------------------------------
# 3. 结构语义："几段/多少/几个" 在本领域指什么。回答前必须先消歧。
# ---------------------------------------------------------------------------
structure_semantics:
  segment: 条款 / 分层（tranche）/ 档位 / 份额类别
  copy: 版本 / 修订 / 批次（发行批次）
  variant: 份额类别 / 结构化分层 / 合约变体
  unit: 金额 / 基点（bp）/ 股数 / 份额 / 合约张数
  level: 市场 < 资产类别 < 产品 < 合约 < 条款 < 现金流 < 头寸 < 组合
  stage: 发行 -> 存续 -> 到期 / 清算

# ---------------------------------------------------------------------------
# 4. 权威来源优先级（1 最高）。检索应按序尝试，不要一上来就查百科。
# ---------------------------------------------------------------------------
authoritative_sources:
  - name: 监管披露（证监会 / 央行 / SEC EDGAR）
    kind: regulatory_filing
    id_pattern: "公告编号 / CIK + accession number（如 0000320193-24-000123）"
    priority: 1
  - name: 招股书与募集说明书
    kind: prospectus
    id_pattern: "发行文件编号 + 日期（如招股说明书 2024-03）"
    priority: 1
  - name: 审计报告与财报（10-K / 10-Q / 年报）
    kind: audited_financials
    id_pattern: "ticker + 财年 + 报告类型"
    priority: 2
  - name: 交易所披露与行情数据（Wind / 彭博 / 交易所）
    kind: market_data
    id_pattern: "证券代码 + 日期 / ISIN / CUSIP"
    priority: 2
  - name: 评级报告（标普 / 穆迪 / 中诚信）
    kind: rating_report
    id_pattern: "评级公告编号"
    priority: 3

# ---------------------------------------------------------------------------
# 5. 证据等级细化（只能加约束，不能整体降级）。
# ---------------------------------------------------------------------------
evidence_grades:
  A: >
    多源交叉印证：监管披露 + 审计财报 + 交易所数据一致；或覆盖多市场、含样本外检验的审慎研究。
  B: >
    单一权威来源（审计财报、监管文件、交易所数据）加方法说明；口径披露完整的研究。
  C: >
    单一券商研报、单数据库快照、未经审计数据、无样本外验证的回测。
  D: 财经媒体、自媒体、百科、AI 生成摘要、营销材料。
  rules:
    - 必须标注名义/实际、税前/税后、含费/不含费与 GAAP / IFRS / 非 GAAP 口径。
    - 回测须报告样本期、交易成本、幸存者偏差处理与样本外结果，否则降为 C。
    - 单一机构或单一样本结论不得写成市场规律；输出不构成投资建议。

# ---------------------------------------------------------------------------
# 6. 反例与边界检查（本领域必须执行的检查项）。
# ---------------------------------------------------------------------------
counterexample_rule: >
  1) 样本期偏差：换样本期（牛熊、利率周期）结论即失效；
  2) 幸存者偏差：退市、清盘、违约样本被剔除会系统性高估收益；
  3) 回测过拟合：参数敏感、多重检验、无样本外结果，即视为反例；
  4) 杠杆与流动性条件：加杠杆、低流动性下的收益无法在普通条件下复现；
  5) 名义 vs 实际：未扣通胀、费用与税负的收益不等于投资者所得；
  6) 会计口径与监管辖区：GAAP / IFRS / 非 GAAP、不同辖区披露不可直接横比。

# ---------------------------------------------------------------------------
# 7. 必须消歧的术语（回答"几段/多少/是否都成立"前先定锚）。
# ---------------------------------------------------------------------------
disambiguation:
  - term: 收益率
    candidates: [名义收益, 实际收益, 含费收益, 税前/税后, 时间加权 TWR, 资金加权 MWR]
    resolve_by: 先定口径（nominal/real、gross/net）与期间，再跨产品比较。
  - term: 规模 / 多少
    candidates: [发行规模, 存续规模, AUM, 名义本金, 市值]
    resolve_by: 用 structure_semantics 定锚，注明时点与币种。

# ---------------------------------------------------------------------------
# 8. 好答案的形态（报告对应章节应长这样）。
# ---------------------------------------------------------------------------
answer_patterns:
  - type: element_inventory
    shape: "要素表：产品/合约 | 条款 | 分层 | 规模 | 期限 | 风险因子 | 证据等级"
  - type: scope
    shape: "适用矩阵：结论 | 市场/辖区 | 样本期 | 杠杆与流动性条件 | 会计口径 | 反例"

# ---------------------------------------------------------------------------
# 9. 停止提示（本领域常见的"该停了"信号）。
# ---------------------------------------------------------------------------
stop_hints:
  - 监管披露 + 审计财报 + 交易所数据三方一致。
  - 只有二手研报且无法回溯原始披露 -> 标注"二手数据"。
  - 结论依赖未来价格或政策 -> 标注"预测性结论，不保证"。

frontier_sources:
  - SSRN / NBER working paper（标注未经同行评议）
  - BIS / IMF / 央行金融稳定报告与交易所新规
