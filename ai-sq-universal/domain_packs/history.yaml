# ============================================================================
# Domain Pack: history
# AI-SQ Universal Root-Inquiry / 通用求根问底调研 Skill
# ----------------------------------------------------------------------------
# 领域包不是装饰，而是通用内核的适配接口。
# 内核管：问题树 / 证据链 / 缺口递归 / 范围与反例 / 层级校验 / 停止控制 / 报告。
# 领域包管：实体层级 / 关系类型 / 结构语义 / 权威源 / 证据分级 / 高风险边界。
#
# 领域包不得绕过通用规则：反例检查、层级校验、停止规则、质量门禁永远优先。
# 领域包只能"细化"证据等级，不能把通用 A/B/C/D 地板整体降级。
# ============================================================================

domain: history
display_name: 历史学 / History
version: 1.0.0
extends: null
high_risk: false
high_risk_note: >
  通用历史问题默认低风险；但涉及种族灭绝与大规模暴行（genocide / atrocity）、战争罪行、
  政治迫害、宗教与族群冲突、领土与身份认同争议（contested identity）时，必须保持中立：
  区分"史料能支持的事实陈述"与"价值判断"，多方叙事并列呈现并各自标注史料基础；
  不美化、不否认、不娱乐化暴行；不输出可用于煽动族群仇恨、锁定或人肉特定个人、
  组织现实政治动员的内容；遇历史修正主义争论，须明确标注主流学界共识、争议边界
  与否认主义（denialism）的伪史学特征。

# ---------------------------------------------------------------------------
# 1. 实体层级（粗 -> 细）。用于层级校验：防止把时期结论套到事件、把史家解释当史料。
# ---------------------------------------------------------------------------
entity_levels:
  - period              # 时期 / 时代（如 先秦、近代、中世纪）
  - era                 # 阶段 / 分期（断代单元，如 晚清、战后重建期）
  - process             # 长时段过程 / 趋势（人口、气候、经济、制度变迁）
  - event               # 事件（如 某战役、某条约、某次会议）
  - institution         # 制度（如 科举、行会、关税制）
  - organization        # 政权 / 组织 / 集团 / 派系
  - person              # 人物 / 群体 / 社会阶层
  - causal_chain        # 因果链（结构性条件 -> 触发 -> 过程 -> 结果）
  - interpretation      # 史学解释 / 范式 / 学派（如 年鉴学派、全球史）
  - source_stratum      # 史料层：一手 / 二手 / 考古 / 口述 / 后世追述
  - source              # 史料单元（档案、文献、实物、图像、口述记录）
  - record              # 记载单元（版本、卷次、条目、段落、异文）
  - chronology          # 年代学单元（绝对年代、相对年代、误差区间）

# ---------------------------------------------------------------------------
# 2. 允许的关系类型。问题节点 relation 字段应落在此清单内，避免自造关系。
# ---------------------------------------------------------------------------
relations:
  - is_a
  - part_of
  - has_property
  - causes
  - contributes_to
  - precedes
  - located_in
  - requires
  - regulates
  - conflicts_with
  - evidence_for
  - counterexample_to
  - correlates_with
  - measured_by

# ---------------------------------------------------------------------------
# 3. 结构语义："几段/多少/几个" 在本领域指什么。回答前必须先消歧。
# ---------------------------------------------------------------------------
structure_semantics:
  segment: 阶段 / 分期 / 史料层级 / 记载段落
  copy: 抄本 / 版本 / 重印
  variant: 史料异文 / 不同记载 / 修订版
  unit: 年 / 月 / 日（断代单位）；卷 / 册 / 页 / 行（文本单位）
  level: 个案/微观史 < 地方/区域史 < 国别史 < 跨国/全球史
  stage: 分期阶段（上古—中古—近代—现代）/ 史学范式阶段（兰克式实证 -> 年鉴学派 -> 新文化史 -> 全球史）

# ---------------------------------------------------------------------------
# 4. 权威来源优先级（1 最高）。检索应按序尝试，不要一上来就查百科。
# ---------------------------------------------------------------------------
authoritative_sources:
  - name: 国家档案馆一手档案
    kind: primary_archive
    id_pattern: "全宗号 / 案卷号 / 件号（如 档案号 002-01-0001）"
    priority: 1
  - name: 考古发掘报告与发掘简报
    kind: archaeological_report
    id_pattern: "遗址名 + 发掘年度 + 层位/探方编号"
    priority: 1
  - name: 同行评议专著（学术出版社）
    kind: peer_reviewed_monograph
    id_pattern: "ISBN / 出版社 + 版次 + 页码"
    priority: 2
  - name: 核心期刊论文（历史学）
    kind: peer_reviewed_article
    id_pattern: "DOI / 期刊名 + 年卷期 + 页码"
    priority: 2
  - name: 史料汇编 / 校勘本 / 影印本
    kind: source_compilation
    id_pattern: "丛书名 + 卷次 + 条目号 / 底本与参校本"
    priority: 3
  - name: 口述史（须标注访谈者、受访者、时间、整理与保存方式）
    kind: oral_history
    id_pattern: "访谈记录编号 + 访谈日期"
    priority: 4
  - name: 百科 / 新闻 / 影视 / 自媒体
    kind: encyclopedia
    id_pattern: "URL"
    priority: 5

# ---------------------------------------------------------------------------
# 5. 证据等级细化（只能加约束，不能整体降级）。
# ---------------------------------------------------------------------------
evidence_grades:
  A: >
    多类独立史料互证（如档案 + 考古 + 同时代文献），且经过明确的史料批判
    （来源、动机、传承链均已讨论）；或多个独立研究得出一致结论并已回应主要反例。
  B: >
    同行评议专著/核心期刊论文，史料基础可检验；或单一档案系统内多份独立文件互证，
    但缺少第二类来源的交叉验证。
  C: >
    单一史料、孤证、二手转述、后世追述、区域个案、口述史单条记录、
    未区分原文与转述的引用。
  D: 百科、新闻、影视剧、自媒体、AI 生成摘要、无法追溯出处的"据说"。
  rules:
    - 一手史料不自动等于 A；孤证即使是一手档案，最高记 C。
    - 二手研究不得当一手史料引用；引用二手研究时必须同时标注其依赖的原始史料。
    - 晚出文献记载早期事件，默认 C，除非有独立传承链证明其依据更早材料。
    - 口述史默认 C；与档案/实物互证后可升 B，且必须标注回忆偏差与访谈情境。
    - 考古证据与文献证据不可直接等同：器物年代不等于文献所记事件年代。
    - 否定性结论（"没有发生/不存在"）必须讨论史料存留概率，否则不高于 C。
    - 争议问题存在两说以上时，A 级只能给"并列呈现且各自史料完整"的综述，不能给单一说。

# ---------------------------------------------------------------------------
# 6. 反例与边界检查（本领域必须执行的检查项）。
# ---------------------------------------------------------------------------
counterexample_rule: >
  1) 史料缺失（沉默的证据）：未被记载 != 不存在，须先估算史料存留概率与记录者动机；
  2) 幸存者偏差：存世史料偏向权力者、识字者、胜者与中心地区，边缘群体要专门检索；
  3) 记载者立场：官方/私人/敌方/宗教/殖民视角须分别标注，同一事件必须交叉核对；
  4) 后世层累建构：晚出记载对早事的"补写"须剥离层累（如古史辨），区分当时记录与后代追述；
  5) 以论代史：先有结论再挑史料是循环论证，必须做反面检索（search for disconfirming sources）；
  6) 单一史料孤证：孤证不立，最高记 C；若坚持采信，必须说明为何此孤证可信；
  7) 年代学误差：碳十四、树轮、文献纪年各有误差区间，跨体系年代不可等值换算；
  8) 竞争性解释：至少给出一个替代解释并说明排除理由，否则不得下单一因果结论。

# ---------------------------------------------------------------------------
# 7. 必须消歧的术语（回答"几段/多少/是否都成立"前先定锚）。
# ---------------------------------------------------------------------------
disambiguation:
  - term: 什么时候 / 多久
    candidates: [事件发生时间, 文献成书或抄写时间, 考古层位年代, 制度存续期, 史学分期]
    resolve_by: 先分清"事件时间 / 文本时间 / 物质年代 / 制度存续"，并给年代误差区间。
  - term: 记载 / 史料
    candidates: [一手档案, 考古实物, 同时代文献, 二手研究, 口述史, 后世追述]
    resolve_by: 按 structure_semantics 的史料层级定锚，先问"这是谁、何时、为何记录的"。
  - term: 为什么 / 原因
    candidates: [结构性原因（长时段）, 直接原因, 偶然契机, 史家解释框架]
    resolve_by: 分层归因，区分"原因 / 条件 / 借口 / 解释"，并列出竞争性解释。
  - term: 是否真实
    candidates: [史料可证, 史料不载但可能, 后世建构, 明显虚构]
    resolve_by: 把"真实"拆成"发生过 / 如记载所述 / 被如此记忆"三层分别回答。

# ---------------------------------------------------------------------------
# 8. 好答案的形态（报告对应章节应长这样）。
# ---------------------------------------------------------------------------
answer_patterns:
  - type: element_inventory
    shape: "史料表：材料 | 类型（一手/二手/考古/口述）| 年代（含误差）| 作者或出土地 | 存世与版本 | 可信度 | 证据等级"
  - type: causal
    shape: "因果链：结构性条件 -> 触发事件 -> 过程 -> 结果与后续影响；标注必要/充分/促成，附反事实与竞争解释"
  - type: scope
    shape: "适用性矩阵：结论 × 时间范围 × 空间范围 × 社会层次 × 史料基础 × 反例 × 证据等级"

# ---------------------------------------------------------------------------
# 9. 停止提示（本领域常见的"该停了"信号）。
# ---------------------------------------------------------------------------
stop_hints:
  - 已做到"史料三角验证"：至少两类独立来源（档案+考古，或文献+口述）互相印证。
  - 争议问题各方主要解释均已列出，并标注了各自的史料基础与薄弱处。
  - 继续检索只得到同一叙事的转述（互相抄袭的二手文献）-> 停止并标注"转述链"。
  - 问题进入已佚史料的细节层面 -> 标记"史料不足，无法判定"。
  - 涉及价值判断或身份认同 -> 停止追问"唯一真相"，转为并列呈现立场与证据。

frontier_sources:
  - 中文核心期刊《历史研究》《近代史研究》《中国社会科学》；英文 American Historical Review / Past & Present
  - 国家档案馆与图书馆数字化项目（如 中国第一历史档案馆、国家图书馆数字方志）
  - 考古发掘简报与年度考古报告（《考古》《文物》、Antiquity）
  - 史学理论期刊（History and Theory）与全球史 / 新文化史综述
