# ============================================================================
# Domain Pack: business
# AI-SQ Universal Root-Inquiry / 通用求根问底调研 Skill
# ----------------------------------------------------------------------------
# 内核管：问题树 / 证据链 / 缺口递归 / 范围与反例 / 层级校验 / 停止控制 / 报告。
# 领域包管：实体层级 / 关系 / 结构语义 / 权威源 / 证据分级 / 高风险边界；只细化、不降级、不绕过校验。
# ============================================================================

domain: business
display_name: 商业 / Business
version: 1.0.0
extends: null
high_risk: false
high_risk_note: >
  通用商业问题默认低风险；但涉及内幕信息、未公开重大信息、证券交易建议、财务造假指控、
  商业秘密或个人隐私时升级为高风险：须拒绝内幕信息、标注推测、建议合规与法务复核。

# ---------------------------------------------------------------------------
# 1. 实体层级（粗 -> 细）。用于层级校验：公司属性不得套到 SKU，行业数据不得当公司数据。
# ---------------------------------------------------------------------------
entity_levels:
  - industry            # 行业
  - company             # 公司
  - business_line       # 业务线 / 分部
  - product             # 产品
  - sku                 # SKU / 单品
  - market              # 市场（地域 / 客群）
  - channel             # 渠道（直营 / 经销 / 电商）
  - customer            # 客户 / 用户
  - revenue_stream      # 收入流
  - cost_item           # 成本项
  - competitor          # 竞争（对手 / 竞争地位）

# ---------------------------------------------------------------------------
# 2. 允许的关系类型。问题节点 relation 字段应落在此清单内，避免自造关系。
# ---------------------------------------------------------------------------
relations:
  - is_a
  - part_of
  - has_property
  - causes
  - measured_by
  - evidence_for
  - counterexample_to

# ---------------------------------------------------------------------------
# 3. 结构语义："几段/多少/几个" 在本领域指什么。回答前必须先消歧。
# ---------------------------------------------------------------------------
structure_semantics:
  segment: 业务线 / SKU / 区域 / 合同条款
  copy: 版本 / SKU 变体 / 批次
  variant: 渠道 / 定价档 / 区域版本
  unit: 收入 / 销量 / 单价 / 毛利率 / 市占率
  level: 行业 < 公司 < 业务线 < 产品 < SKU < 订单
  stage: 研发 -> 上市 -> 增长 -> 成熟 -> 衰退

# ---------------------------------------------------------------------------
# 4. 权威来源优先级（1 最高）。检索应按序尝试，不要一上来就查百科。
# ---------------------------------------------------------------------------
authoritative_sources:
  - name: 年报与财报（SEC 10-K / 10-Q、巨潮资讯）
    kind: annual_report
    id_pattern: "ticker + 财年 + 报告类型（10-K / 年报）"
    priority: 1
  - name: 招股书 / 注册文件（S-1 / 招股说明书）
    kind: prospectus
    id_pattern: "发行文件编号 + 日期"
    priority: 1
  - name: 监管披露与公司公告（交易所 / 工商 / 诉讼）
    kind: regulatory_filing
    id_pattern: "公告编号 / 案号"
    priority: 2
  - name: 行业报告与第三方研究（Euromonitor / 协会 / 券商）
    kind: industry_report
    id_pattern: "报告名称 + 发布机构 + 年份"
    priority: 3
  - name: 渠道调研、终端数据与专利招聘数据
    kind: primary_channel_data
    id_pattern: "数据源 + 时点（如电商 SKU 抓取 2024-Q3）"
    priority: 4

# ---------------------------------------------------------------------------
# 5. 证据等级细化（只能加约束，不能整体降级）。
# ---------------------------------------------------------------------------
evidence_grades:
  A: >
    年报或招股书 + 监管披露 + 渠道/第三方数据相互印证；或覆盖多公司、跨周期的行业研究。
  B: >
    单一权威披露（审计财报、招股书）加方法说明；口径、期间与分部拆分披露完整。
  C: >
    单一行业报告、单一渠道调研、未经审计数据、以样本公司推断行业。
  D: 公司宣传材料、媒体、自媒体、百科、AI 生成摘要。
  rules:
    - 必须区分 sell-in（出货）与 sell-through（终端销售），渠道库存变化单独列示。
    - 非 GAAP / 经调整口径须还原为统一口径；一次性损益须单独剔除。
    - 单一公司或单点调研不得写成行业规律；涉及未公开重大信息须拒答。

# ---------------------------------------------------------------------------
# 6. 反例与边界检查（本领域必须执行的检查项）。
# ---------------------------------------------------------------------------
counterexample_rule: >
  1) 幸存者偏差：只看成功公司或存续门店会高估行业回报；
  2) 渠道库存与压货：sell-in 不等于 sell-through，补库存/去库存会扭曲增长；
  3) 口径调整：非 GAAP、经调整利润与口径变更年份须还原；
  4) 关联交易：关联方收入未必市场化，须剔除或折价；
  5) 季节性与一次性损益：单季数据不得年化，处置/减值/补贴/诉讼赔偿须剔除；
  6) 样本公司不代表行业：龙头与上市公司样本存在选择偏差。

# ---------------------------------------------------------------------------
# 7. 必须消歧的术语（回答"几段/多少/是否都成立"前先定锚）。
# ---------------------------------------------------------------------------
disambiguation:
  - term: 市场份额
    candidates: [按收入, 按销量, 按门店数, 按出货量, 按 GMV]
    resolve_by: 定口径与分母（品类边界、地域、期间）后再比较。
  - term: 增长
    candidates: [同比, 环比, 同店增长, 内生 vs 并购, 汇率中性]
    resolve_by: 拆分 organic / inorganic 与 FX 影响后再给结论。

# ---------------------------------------------------------------------------
# 8. 好答案的形态（报告对应章节应长这样）。
# ---------------------------------------------------------------------------
answer_patterns:
  - type: element_inventory
    shape: "业务要素表：业务线/SKU | 收入占比 | 毛利率 | 渠道 | 区域 | 竞争地位 | 证据等级"
  - type: scope
    shape: "可比矩阵：结论 | 公司样本 | 期间 | 渠道/区域 | 会计口径 | 反例"

# ---------------------------------------------------------------------------
# 9. 停止提示（本领域常见的"该停了"信号）。
# ---------------------------------------------------------------------------
stop_hints:
  - 年报 + 招股书 + 监管公告三角验证一致。
  - 仅有渠道传闻或单点调研 -> 标注"待验证"。
  - 未披露的分部数据无法拆分 -> 标记"披露边界"，不得把估算当事实。

frontier_sources:
  - 公司投资者关系页面与业绩说明会记录
  - 专利数据库 / 招聘平台数据 / 供应链调研
